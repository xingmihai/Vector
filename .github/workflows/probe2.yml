name: probe2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Assemble
        continue-on-error: true
        run: |
          ./gradlew :manager:assembleRelease --console=plain 2>&1 | tee build.log || true

      - name: Errors
        if: always()
        run: |
          grep -E '^e: ' build.log > err.txt || true
          grep -n -A 25 'What went wrong' build.log >> err.txt || true
          wc -l err.txt || true

      - name: Publish
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B probe2-out
          touch err.txt build.log
          git add -f err.txt build.log
          git commit -m "probe2 output" || echo nothing
          git push -f origin probe2-out
