name: Probe compile errors

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and capture
        run: |
          set -uo pipefail
          mkdir -p out
          ./gradlew :manager:compileDebugKotlin > out/log.txt 2>&1 || true
          grep -E "^e:|error:|warning: .*unresolved" out/log.txt > out/err.txt || true
          wc -l out/err.txt
          head -c 12000 out/err.txt > out/tail.txt
      - name: Push log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd out
          split -b 60k -d -a 3 tail.txt part_
          for f in part_*; do base64 -w 0 "$f" > "$f.b64"; rm "$f"; done
          ls -la *.b64 | awk '{print $5, $9}' > manifest.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B dist
          git add -A
          git commit -m "probe log" || echo nothing
          git push -f origin dist
