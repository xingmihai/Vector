name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Libxposed from Maven
        run: |
          set -euo pipefail
          bash .github/scripts/fetch-libxposed.sh || true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile Kotlin
        run: |
          ./gradlew :manager:compileReleaseKotlin :manager-ui:compileReleaseKotlin --console=plain 2>&1 | tee build.log
          echo "=== ERRORS ==="
          grep -E '^e: ' build.log | head -40 || true
          echo "=== DONE ==="
        continue-on-error: true
