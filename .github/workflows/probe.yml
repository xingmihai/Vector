name: probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile
        id: c
        run: |
          set -o pipefail
          ./gradlew :manager:compileReleaseKotlin :manager-ui:compileReleaseKotlin --console=plain 2>&1 | tee build.log
          echo "exit=$?"
        continue-on-error: true

      - name: Errors
        run: |
          grep -E '^e: ' build.log > err.txt || true
          echo "--- count ---"
          wc -l err.txt
          head -60 err.txt
          echo "--- tail of build.log ---"
          tail -40 build.log

      - name: Publish err
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B probe-out
          cp build.log probe-build.log || true
          cp err.txt probe-err.txt || true
          git add -A
          git commit -m "probe output" || echo nothing
          git push -f origin probe-out
