name: probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile
        id: c
        continue-on-error: true
        run: |
          ./gradlew :manager:compileReleaseKotlin :manager-ui:compileReleaseKotlin --console=plain 2>&1 | tee build.log

      - name: Errors
        if: always()
        run: |
          grep -E '^e: ' build.log > err.txt || true
          wc -l err.txt
          head -60 err.txt
          echo "--- tail ---"
          tail -30 build.log

      - name: Publish err
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B probe-out
          touch err.txt build.log
          git add -f err.txt build.log
          git commit -m "probe output" || echo nothing
          git push -f origin probe-out
