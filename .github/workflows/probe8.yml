name: probe8

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Only the two modules that hold the screen. The daemon needs the libxposed sources
      # that this workflow does not set up, and compiling it here would bury the errors
      # being looked for under a hundred of its own.
      - name: Compile
        continue-on-error: true
        run: |
          ./gradlew :manager:compileReleaseKotlin :manager-ui:compileReleaseKotlin 2>&1 | tee build.log || true

      - name: Errors
        if: always()
        run: |
          grep -E '^e: ' build.log > err.txt || true
          grep -n -A 30 'What went wrong' build.log >> err.txt || true
          wc -l err.txt || true

      - name: Publish
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@example.com"
          git checkout --orphan probe8out || git checkout probe8out
          git rm -rf . || true
          git add -f err.txt
          git commit -m "ci: probe output"
          git push -f origin probe8out
