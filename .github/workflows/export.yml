name: Export release zip to branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out
          gh release download canary-3234 --pattern '*Release.zip' --dir out
          mv out/Vector-*-Release.zip out/Vector-Release.zip
          sha256sum out/Vector-Release.zip | tee out/sha256.txt

      - name: Split into text chunks
        run: |
          set -euo pipefail
          cd out
          rm -f part_* manifest.txt
          split -b 250k -d -a 3 Vector-Release.zip part_
          for f in part_*; do base64 -w 0 "$f" > "$f.b64"; rm "$f"; done
          ls -la *.b64 | awk '{print $5, $9}' > manifest.txt

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B dist
          git add -A
          git commit -m "Export Vector release zip (base64 chunks)" || echo "nothing"
          git push -f origin dist
