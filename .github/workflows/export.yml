name: Export release zip to branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out
          ID=$(curl -sSL -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/${{ github.repository }}/releases/tags/canary-3176" \
             | python3 -c "
          import json,sys
          r=json.load(sys.stdin)[0]
          print([a['id'] for a in r['assets'] if 'Release' in a['name']][0])
          ")
          echo "asset id=$ID"
          curl -sSL -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/octet-stream" \
               -o out/Vector-Release.zip \
               "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ID"
          ls -la out/
          sha256sum out/Vector-Release.zip | tee out/sha256.txt

      - name: Split into text chunks
        run: |
          set -euo pipefail
          cd out
          rm -f part_* manifest.txt
          split -b 250k -d -a 3 Vector-Release.zip part_
          for f in part_*; do base64 -w 0 "$f" > "$f.b64"; rm "$f"; done
          ls -la *.b64 | awk '{print $5, $9}' > manifest.txt
          cat manifest.txt

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B dist
          git add -A
          git commit -m "Export Vector release zip (base64 chunks)" || echo "nothing"
          git push -f origin dist
