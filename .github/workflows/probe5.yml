name: probe4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Assemble
        continue-on-error: true
        run: |
          ./gradlew :manager:assembleRelease --console=plain 2>&1 | tee build.log || true

      - name: Errors
        if: always()
        run: |
          grep -E '^e: ' build.log > err.txt || true
          grep -n -A 25 'What went wrong' build.log >> err.txt || true
          wc -l err.txt || true

      - name: Publish
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@example.com"
          git checkout --orphan probe4out || git checkout probe4out
          git rm -rf . || true
          git add -f err.txt
          git commit -m "ci: probe output"
          git push -f origin probe4out
